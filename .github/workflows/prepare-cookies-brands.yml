name: Comprobar cookies y fichas de cámaras
on:
  push:
    branches: [revision/cookies-marcas]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrar fuentes y comprobar HTML
        run: |
          python scripts/prepare-cookies-brands.py
          npm run build
          npm test
      - name: Comprobar navegador y privacidad
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/rapid.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python tests/cookies-brands-browser.py
          python tests/browser.py
          python tests/local-media-browser.py
          python tests/privacy-seo-browser.py
      - name: Guardar solo fuentes probadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views.mjs src/legal.mjs src/metadata.mjs scripts/build.mjs scripts/content-audit.mjs tests/site.test.mjs tests/browser.py tests/privacy-seo-browser.py
          git commit -m 'feat: integrar cookies informativas y cinco fichas de cámaras ampliadas'
          git push origin HEAD:revision/cookies-marcas
      - name: Evidencia
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/fuentes.zip
          cp .cache/*report.json artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-marcas-revision
          path: artifacts/
          retention-days: 7
