name: Verificar web
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exportar fuentes para revisión
        uses: actions/upload-artifact@v4
        with:
          name: fuentes-revision
          path: |
            data
            public/assets
          retention-days: 7
