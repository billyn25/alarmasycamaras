name: Revisar políticas, guías y auditoría SEO
on:
  push:
    branches: [revision/politicas-seo]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar y validar fuentes
        run: |
          python scripts/apply-editorial.py
          npm run build
          npm test
      - name: Pruebas de navegador sin enviar consultas
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/rapid-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python tests/browser.py
          python tests/local-media-browser.py
          python tests/privacy-seo-browser.py
      - name: Guardar fuentes comprobadas sin modificar workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/site.json package.json scripts/build.mjs src/views.mjs tests/site.test.mjs
          git commit -m 'feat: políticas R.F.G., cuatro guías y metadatos revisados'
          git push origin HEAD:revision/politicas-seo
      - name: Evidencia
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/fuentes.zip
          cp .cache/*report.json artifacts/ 2>/dev/null || true
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-politicas-seo
          path: artifacts/
          retention-days: 7
