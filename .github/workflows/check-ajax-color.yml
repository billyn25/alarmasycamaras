name: Comprobar color de referencia Ajax
on:
  push:
    branches: [revision/verde-ajax-locales]
    paths: [.github/workflows/check-ajax-color.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Leer estilos públicos oficiales
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import re, json, hashlib, collections, concurrent.futures
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlparse
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.css=[]
              def handle_starttag(self,t,a):
                  d=dict(a)
                  if t=='link' and 'stylesheet' in d.get('rel',''): self.css.append(d.get('href',''))
          def get(url):
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as r: return url,r.read(4000000).decode('utf-8','replace')
              except Exception as e: print('ERROR',url,str(e)); return url,''
          pages=['https://ajax.systems/','https://ajax.systems/branding-guidelines/colors/','https://ajax.systems/es/']
          sources=[]; css_urls=set()
          for url,text in concurrent.futures.ThreadPoolExecutor(max_workers=3).map(get,pages):
              p=Links();p.feed(text)
              for path in p.css:
                  c=urljoin(url,path)
                  if urlparse(c).hostname=='ajax.systems' or urlparse(c).hostname.endswith('.ajax.systems'): css_urls.add(c)
              sources.append((url,text)); print('PAGE',url,'BYTES',len(text),'STYLES',len(p.css))
          sources+=list(concurrent.futures.ThreadPoolExecutor(max_workers=8).map(get,sorted(css_urls)[:35]))
          report=[]
          for url,text in sources:
              counts=collections.Counter(re.findall(r'#[0-9a-fA-F]{6}\b|#[0-9a-fA-F]{3}\b',text))
              greens=[]
              for value,n in counts.most_common():
                  h=value[1:];h=''.join(c*2 for c in h) if len(h)==3 else h
                  r,g,b=[int(h[i:i+2],16) for i in (0,2,4)]
                  if g>100 and g>r*1.2 and g>b*1.15:
                      at=text.find(value);greens.append({'hex':value,'count':n,'sample':text[max(0,at-160):at+180]})
              variables=re.findall(r'[^;{}]{0,100}(?:green|Green)[^;{}]{0,130}',text)
              if greens or variables:
                  row={'source':url,'sha256':hashlib.sha256(text.encode()).hexdigest(),'greens':greens[:15],'variables':variables[:25]}
                  report.append(row);print(json.dumps(row,ensure_ascii=False))
          Path('artifacts/ajax-color-reference.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          if not report: raise SystemExit('No se ha obtenido un color verificable; no inventarlo.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ajax-color-reference
          path: artifacts/
          retention-days: 7
