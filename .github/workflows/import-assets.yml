name: Importar fuentes de revisión
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-assets.yml'
permissions:
  contents: write
concurrency:
  group: import-assets
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Incorporar datos y fotografías de producto para revisión
        run: |
          python3 - <<'PY'
          import urllib.request, json, pathlib, hashlib, time
          root = pathlib.Path('.')
          def download(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (compatible; RapidPreview/1.0)'})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return response.read()
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(3 * (attempt + 1))
          source = 'https://raw.githubusercontent.com/codeforspain/ds-organizacion-administrativa/1e9c99280ef4d7a12def33cafc3df59d9fc1f688/data/municipios.json'
          raw = download(source)
          allowed = {'01','48','09','39','20','31','26','24','47','49','05','34','37','40','42','28','33','45','19'}
          municipalities = [{'id': x['municipio_id'], 'province': x['provincia_id'], 'name': x['nombre'].replace('\\/', '/')} for x in json.loads(raw) if x['provincia_id'] in allowed]
          assert len(municipalities) > 3500
          assert len({x['id'] for x in municipalities}) == len(municipalities)
          assert {x['province'] for x in municipalities} == allowed
          (root / 'data').mkdir(exist_ok=True)
          (root / 'data/municipios.json').write_text(json.dumps({'source': source, 'sourceCommit': '1e9c99280ef4d7a12def33cafc3df59d9fc1f688', 'scope': 'Municipios de 19 provincias; no incluye todas las entidades menores. Revisar actualización INE antes de producción.', 'municipalities': municipalities}, ensure_ascii=False, separators=(',',':')) + '\n')
          sources = [
              ('ajax-kit.jpg', 'https://www.easyalarm.it/cdn/shop/files/MotionCamAjaxWhite.jpg?v=1739229998', 'Ajax StarterKit Cam, imagen comercial de producto distribuida por Easy Alarm'),
              ('ajax-turret.jpg', 'https://www.raskpreke.lt/images/uploader/aj/1000x1000.g/ajax-turretcam-64927197wh1-28mm-balta-8mp-50m-ir-mikrofonas-microsd-256gb-ip65.jpg?v=1763849841', 'Ajax TurretCam, imagen comercial de producto distribuida por Raskpreke')
          ]
          (root / 'public/assets').mkdir(parents=True, exist_ok=True)
          records = []
          for filename, url, description in sources:
              data = download(url)
              assert len(data) > 4000 and len(data) < 5000000, filename
              assert data.startswith(b'\xff\xd8') or data.startswith(b'\x89PNG') or data.startswith(b'RIFF'), filename
              (root / 'public/assets' / filename).write_bytes(data)
              records.append({'file': filename, 'source': url, 'description': description, 'sha256': hashlib.sha256(data).hexdigest(), 'rights': 'Imagen comercial para maqueta de revisión; confirmar permiso de uso antes de producción. No representa un trabajo de Rapid.'})
          (root / 'data/media-sources.json').write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\n')
          print('Municipios:', len(municipalities), '| Provincias:', len(allowed))
          PY
      - name: Guardar fuentes en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data public/assets
          if ! git diff --cached --quiet; then
            git commit -m 'assets: incorporar catálogo municipal y fotografías de revisión [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
