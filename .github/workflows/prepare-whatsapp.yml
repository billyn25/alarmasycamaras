name: Preparar formulario WhatsApp
on:
  push:
    branches: [revision/formulario-whatsapp]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrar y comprobar
        run: |
          python scripts/apply-whatsapp-form.py
          npm run build
          npm test
      - name: Navegador y regresiones sin enviar mensajes
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/rapid-quote.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python tests/quote-form-browser.py
          python tests/browser.py
          python tests/facilities-browser.py
          python tests/privacy-seo-browser.py
          python tests/cookies-brands-browser.py
          python tests/local-media-browser.py
      - name: Guardar fuentes comprobadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/views.mjs src/legal.mjs public/app.js scripts/build.mjs tests/browser.py tests/privacy-seo-browser.py tests/facilities-browser.py tests/facilities.test.mjs tests/site.test.mjs
          git commit -m 'feat: integrar formulario WhatsApp en contacto y páginas locales'
          git push origin HEAD:revision/formulario-whatsapp
      - name: Evidencia
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/fuentes.zip
          cp .cache/*report.json artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-formulario-whatsapp
          path: artifacts/
          retention-days: 7
