name: Preparar fotos Ajax y verificar revisión
on:
  push:
    branches: [revision/fotos-ajax-confianza]
    paths:
      - .github/workflows/import-ajax-media.yml
      - scripts/import-ajax-media.py
      - scripts/refine-home-20261008.py
      - src/trust.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/revision/fotos-ajax-confianza'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar fotografías y textos
        run: |
          pip install Pillow==11.3.0 playwright==1.57.0
          python scripts/import-ajax-media.py
          python scripts/refine-home-20261008.py
          npm run build
          npm test
      - name: Comprobar presentación y funciones
        run: |
          python -m playwright install --with-deps chromium
          node scripts/serve.mjs > /tmp/rapid-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          python tests/browser.py
      - name: Guardar cambios comprobados en la rama de revisión
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/ajax-keypad-touchscreen.webp public/assets/ajax-bulletcam.webp data/media-sources.json src/security.mjs src/views.mjs scripts/build.mjs public/enhancements.css tests/site.test.mjs tests/browser.py
          git diff --cached --quiet || git commit -m 'fix: imágenes Ajax distintas, compromisos y totales de cobertura'
          git push origin HEAD:revision/fotos-ajax-confianza
      - name: Preparar evidencia de la revisión
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD -o artifacts/fuentes.zip
          cp .cache/*report.json artifacts/ 2>/dev/null || true
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-fotos-ajax
          path: artifacts/
          retention-days: 7
